<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aisle Conflict Board</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --panel2: #1e232b; --line: #2a313b;
    --text: #e6e9ee; --muted: #8b95a3; --high: #ff4d4f; --medium: #faad14;
    --low: #52c41a; --accent: #3ea6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 16px 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .v { font-size: 26px; font-weight: 700; }
  .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .stat.high .v { color: var(--high); } .stat.medium .v { color: var(--medium); }
  main { display: grid; grid-template-columns: 420px 1fr; gap: 16px; padding: 0 22px 22px; height: calc(100vh - 250px); min-height: 520px; }
  .ask { display: flex; gap: 8px; align-items: center; padding: 14px 22px 0; flex-wrap: wrap; }
  .ask input { flex: 1; min-width: 280px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; }
  .ask input:focus { outline: none; border-color: var(--accent); }
  .ask button[type=submit] { background: var(--accent); border-color: var(--accent); color: #001; font-weight: 600; padding: 8px 16px; }
  .ask .ex { font-size: 12px; color: var(--muted); background: transparent; border-style: dashed; }
  .answer { line-height: 1.55; }
  .answer ul { margin: 6px 0; padding-left: 20px; }
  .hits { display: flex; flex-direction: column; gap: 6px; }
  .hit { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 8px 10px; }
  .hit.on { border-color: var(--accent); }
  .hit .score { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 42px; }
  .hit .txt { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .queue { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .filters { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #001; }
  .list { overflow-y: auto; flex: 1; }
  .card { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; border-left: 4px solid transparent; }
  .card:hover { background: var(--panel2); }
  .card.sel { background: var(--panel2); border-left-color: var(--accent); }
  .card.ack { opacity: .45; }
  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card .when { color: var(--muted); font-size: 12px; margin-left: auto; }
  .card .sum { color: var(--text); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .4px; }
  .badge.high { background: rgba(255,77,79,.18); color: var(--high); }
  .badge.medium { background: rgba(250,173,20,.18); color: var(--medium); }
  .badge.low { background: rgba(82,196,26,.18); color: var(--low); }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #252c36; color: #c9d1dc; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; overflow-y: auto; }
  .detail h2 { margin: 0 0 4px; font-size: 18px; }
  .detail .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  video { width: 100%; max-height: 52vh; background: #000; border-radius: 8px; display: block; }
  .vwrap { position: relative; }
  .vwrap canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
  .ovl { display: flex; align-items: center; gap: 10px; margin-top: 6px; color: var(--muted); font-size: 12px; }
  .ovl label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); }
  .gapv { font-size: 22px; font-weight: 700; }
  .gapv.close { color: var(--high); } .gapv.mid { color: var(--medium); } .gapv.far { color: var(--low); }
  .chip.yolo { background: rgba(62,166,255,.15); color: var(--accent); }
  .cams { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
  .cams button { font-size: 12px; }
  .cams button.on { border-color: var(--accent); color: var(--accent); }
  .cams button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #444; }
  .cams button .dot.high { background: var(--high); } .cams button .dot.medium { background: var(--medium); } .cams button .dot.low { background: var(--low); }
  .box { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .box .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .action { border-color: rgba(62,166,255,.4); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .warn { color: var(--medium); font-size: 12px; padding: 6px 22px 0; }
</style>
</head>
<body>
<header>
  <h1>Aisle Conflict Board</h1>
  <span class="sub" id="sub">Loading…</span>
  <span class="spacer"></span>
  <button id="showAck">Show acknowledged</button>
  <button id="refresh">Refresh</button>
</header>
<div class="warn" id="warn" hidden></div>
<form class="ask" id="askForm">
  <input id="askInput" maxlength="300" placeholder="Ask the floor, e.g. &quot;person walking behind a reversing forklift&quot;" autocomplete="off">
  <button type="submit" id="askBtn">Ask the floor</button>
  <button type="button" class="ex">person walking behind a reversing forklift</button>
  <button type="button" class="ex">worker without a hard hat near a forklift</button>
  <button type="button" class="ex">forklift parked in an aisle</button>
</form>
<section class="stats" id="stats"></section>
<main>
  <section class="queue">
    <div class="filters" id="filters"></div>
    <div class="list" id="list"><div class="empty">Loading incidents…</div></div>
  </section>
  <section class="detail" id="detail"><div class="empty">Select an incident to review the clip.</div></section>
</main>
<script>
const BASE = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const EVENT_LABEL = {
  NEAR_MISS: "Near miss", PERSON_IN_PATH: "Person in vehicle path",
  VEHICLE_CONFLICT: "Vehicles blocking each other", BLOCKED_AISLE: "Blocked aisle",
  PALLET_IN_WALKWAY: "Pallet in walkway",
};
const FILTERS = [
  ["all", "All"], ["near_miss", "Near misses"], ["blocked", "Blocked aisles"], ["high", "High risk"],
];
let data = { incidents: [], stats: {} };
let filter = "all", selected = null, selectedCam = 0, showAck = false;
let mode = "incident", askResult = null, askSel = 0, askBusy = false;
let showBoxes = localStorage.getItem("aisle-boxes") !== "off", overlayRun = 0;
const detCache = {};

const fmtGap = (g) => g == null ? "n/a" : g <= 0.1 ? "touching" : `≈ ${g.toFixed(1)} m`;
const gapClass = (g) => g == null ? "" : g < 1 ? "close" : g < 3 ? "mid" : "far";

function videoBlock(source) {
  return `<div class="vwrap"><video id="player" src="${clipUrl(source)}" controls autoplay muted loop playsinline></video><canvas id="overlay"></canvas></div>
    <div class="ovl"><label><input type="checkbox" id="boxesToggle" ${showBoxes ? "checked" : ""}> YOLO boxes + closest gap</label><span id="ovlNote"></span></div>`;
}

async function loadDetections(source) {
  if (!detCache[source]) {
    detCache[source] = fetch(`${BASE}api/detections?source=${encodeURIComponent(source)}`)
      .then((r) => r.ok ? r.json() : null).catch(() => null);
  }
  return detCache[source];
}

async function attachOverlay(source, onInfo) {
  const run = ++overlayRun;
  const toggle = $("boxesToggle");
  if (toggle) toggle.onchange = () => { showBoxes = toggle.checked; localStorage.setItem("aisle-boxes", showBoxes ? "on" : "off"); };
  const det = await loadDetections(source);
  if (run !== overlayRun) return;
  if (onInfo) onInfo(det);
  if (!det) { if ($("ovlNote")) $("ovlNote").textContent = "No YOLO detections for this clip."; return; }
  const labels = Object.entries(det.equipment_labels || {}).map(([k, n]) => `${k} ×${n}`).join(", ");
  $("ovlNote").textContent = `Forklift isn't a YOLO class; spotted as ${labels || "nothing"} in ${det.equipment_frames}/${det.frames.length} frames.`;
  const [sh, sw] = det.shape;
  const draw = () => {
    if (run !== overlayRun) return;
    const video = $("player"), canvas = $("overlay");
    if (!video || !canvas) return;
    const cw = video.clientWidth, ch = video.clientHeight;
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, cw, ch);
    if (showBoxes && det.frames.length) {
      const vw = video.videoWidth || sw, vh = video.videoHeight || sh;
      const scale = Math.min(cw / vw, ch / vh), dw = vw * scale, dh = vh * scale;
      const ox = (cw - dw) / 2, oy = (ch - dh) / 2, kx = dw / sw, ky = dh / sh;
      const fr = det.frames[Math.min(det.frames.length - 1, Math.floor(video.currentTime * det.fps))];
      const X = (x) => ox + x * kx, Y = (y) => oy + y * ky;
      const close = fr.gap_m != null && fr.gap_m < 1;
      ctx.lineWidth = 2.5; ctx.font = "bold 13px system-ui";
      for (const b of fr.e) {
        ctx.setLineDash(fr.held ? [6, 5] : []);
        ctx.strokeStyle = "#faad14"; ctx.strokeRect(X(b[0]), Y(b[1]), (b[2] - b[0]) * kx, (b[3] - b[1]) * ky);
        ctx.fillStyle = "#faad14"; ctx.fillText(fr.held ? "forklift (held)" : "forklift", X(b[0]) + 4, Y(b[1]) - 6);
      }
      ctx.setLineDash([]);
      for (const b of fr.p) {
        ctx.strokeStyle = close ? "#ff4d4f" : "#52c41a"; ctx.strokeRect(X(b[0]), Y(b[1]), (b[2] - b[0]) * kx, (b[3] - b[1]) * ky);
        ctx.fillStyle = ctx.strokeStyle; ctx.fillText("person", X(b[0]) + 4, Y(b[1]) - 6);
      }
      if (fr.line) {
        const [x1, y1, x2, y2] = fr.line;
        ctx.strokeStyle = close ? "#ff4d4f" : "#ffffff"; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke(); ctx.setLineDash([]);
        const label = fmtGap(fr.gap_m), tx = (X(x1) + X(x2)) / 2 + 8, ty = (Y(y1) + Y(y2)) / 2;
        ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(tx - 4, ty - 15, ctx.measureText(label).width + 8, 20);
        ctx.fillStyle = close ? "#ff4d4f" : "#ffffff"; ctx.fillText(label, tx, ty);
      }
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}
const acked = new Set(JSON.parse(localStorage.getItem("aisle-acked") || "[]"));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtSec = (s) => `0:${String(Math.round(s || 0)).padStart(2, "0")}`;
const clipUrl = (src) => `${BASE}clip?source=${encodeURIComponent(src)}`;

function visible() {
  return data.incidents.filter((i) => {
    if (!showAck && acked.has(i.id)) return false;
    if (filter === "high") return i.risk === "high";
    if (filter === "all") return true;
    return i.categories.includes(filter);
  });
}

function renderStats() {
  const s = data.stats || {};
  const open = data.incidents.filter((i) => !acked.has(i.id)).length;
  const cards = [
    ["Open incidents", open, ""], ["High risk", s.high ?? 0, "high"], ["Medium risk", s.medium ?? 0, "medium"],
    ["Near misses", s.near_miss ?? 0, ""], ["Blocked aisles", s.blocked ?? 0, ""],
    ["Clips analyzed", `${s.segments_analyzed ?? 0}/${s.segments_indexed ?? 0}`, ""],
  ];
  $("stats").innerHTML = cards.map(([k, v, c]) => `<div class="stat ${c}"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
}

function renderFilters() {
  $("filters").innerHTML = FILTERS.map(([id, label]) =>
    `<button class="${filter === id ? "on" : ""}" data-f="${id}">${label}</button>`).join("");
  $("filters").querySelectorAll("button").forEach((b) => b.onclick = () => { filter = b.dataset.f; render(); });
}

function renderList() {
  const items = visible();
  if (!items.length) {
    $("list").innerHTML = `<div class="empty">${data.incidents.length ? "Nothing matches this filter." : "No conflicts flagged yet. Clips still being analyzed will appear here."}</div>`;
    return;
  }
  $("list").innerHTML = items.map((i) => `
    <div class="card ${selected === i.id ? "sel" : ""} ${acked.has(i.id) ? "ack" : ""}" data-id="${i.id}">
      <div class="top">
        <span class="badge ${i.risk}">${i.risk}</span>
        <strong>${esc(i.scene)}</strong>
        <span class="when">${fmtSec(i.start_sec)}–${fmtSec(i.end_sec)} · ${i.flagging_cameras}/${i.views.length} cams</span>
      </div>
      <div class="sum">${esc(i.summary)}</div>
      <div class="chips">${i.events.map((e) => `<span class="chip">${EVENT_LABEL[e] || e}</span>`).join("")}${i.yolo_gap ? `<span class="chip yolo">YOLO gap ${fmtGap(i.yolo_gap.gap_m)}</span>` : ""}</div>
    </div>`).join("");
  $("list").querySelectorAll(".card").forEach((c) => c.onclick = () => { selected = c.dataset.id; selectedCam = 0; mode = "incident"; render(); });
}

function mdLite(text) {
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").split("\n");
  let html = "", inList = false;
  for (const line of lines) {
    const m = line.match(/^\s*[-*]\s+(.*)/);
    if (m) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${m[1]}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.trim()) html += `<div>${line}</div>`;
  }
  return html + (inList ? "</ul>" : "");
}

function renderAsk() {
  if (askBusy) { $("detail").innerHTML = `<div class="empty">Searching the warehouse cameras for “${esc($("askInput").value)}”…</div>`; return; }
  const r = askResult;
  if (r.error) { $("detail").innerHTML = `<div class="empty">Search failed: ${esc(r.error)}</div>`; return; }
  if (!r.clips.length) { $("detail").innerHTML = `<h2>Ask the floor</h2><div class="meta">“${esc(r.question)}”</div><div class="empty">No matching moments. Try different wording.</div>`; return; }
  const c = r.clips[askSel] || r.clips[0];
  $("detail").innerHTML = `
    <h2>Ask the floor</h2>
    <div class="meta">“${esc(r.question)}” · ${r.clips.length} matching moments from hybrid search</div>
    ${videoBlock(c.source)}
    <div class="meta" style="margin-top:8px">${esc(c.scene)} · ${esc(c.camera)} · ${fmtSec(c.start_sec)}–${fmtSec(c.end_sec)}${c.risk ? ` · <span class="badge ${c.risk}">${c.risk}</span>` : ""}
      ${c.events.map((e) => `<span class="chip">${EVENT_LABEL[e] || e}</span>`).join(" ")}</div>
    <div class="box answer"><div class="lbl">Answer</div>${mdLite(r.answer)}</div>
    <div class="box"><div class="lbl">Matching clips</div><div class="hits">${r.clips.map((h, n) => `
      <button class="hit ${n === askSel ? "on" : ""}" data-n="${n}">
        <span class="score">${(h.similarity ?? 0).toFixed(2)}</span>
        <span><strong>${esc(h.scene)} · ${esc(h.camera)}</strong> <span class="when">${fmtSec(h.start_sec)}–${fmtSec(h.end_sec)}</span>
        <div class="txt">${esc(h.narrative || "")}</div></span>
      </button>`).join("")}</div></div>`;
  $("detail").querySelectorAll(".hit").forEach((b) => b.onclick = () => { askSel = +b.dataset.n; renderAsk(); });
  attachOverlay(c.source);
}

async function ask(question) {
  question = question.trim();
  if (!question || askBusy) return;
  $("askInput").value = question;
  mode = "ask"; askBusy = true; askSel = 0; selected = null;
  $("askBtn").disabled = true;
  renderList(); renderAsk();
  try {
    const r = await fetch(`${BASE}api/ask`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    const body = await r.json();
    askResult = r.ok ? body : { question, error: body.error || `HTTP ${r.status}` };
  } catch (e) {
    askResult = { question, error: String(e) };
  }
  askBusy = false;
  $("askBtn").disabled = false;
  if (mode === "ask") renderAsk();
}

function renderDetail() {
  if (mode === "ask") return renderAsk();
  const i = data.incidents.find((x) => x.id === selected);
  if (!i) { $("detail").innerHTML = `<div class="empty">Select an incident to review the clip.</div>`; return; }
  const v = i.views[selectedCam] || i.views[0];
  $("detail").innerHTML = `
    <h2><span class="badge ${i.risk}">${i.risk}</span> ${esc(i.scene)} · ${fmtSec(i.start_sec)}–${fmtSec(i.end_sec)}</h2>
    <div class="meta">${esc(i.location)} · ${esc(i.camera_id)} · flagged by ${i.flagging_cameras} of ${i.views.length} camera angles</div>
    ${videoBlock(v.source)}
    <div class="cams">${i.views.map((c, n) => `
      <button class="${n === selectedCam ? "on" : ""}" data-n="${n}"><span class="dot ${c.events.length ? c.risk : ""}"></span>${esc(c.camera)}</button>`).join("")}
    </div>
    <div class="box"><div class="lbl">What happened</div>${esc(i.summary)}</div>
    ${i.action ? `<div class="box action"><div class="lbl">Suggested action</div>${esc(i.action)}</div>` : ""}
    <div class="box" id="gapBox"><div class="lbl">Closest person–forklift gap · ${esc(v.camera)}</div><span class="when">Measuring…</span></div>
    <div class="box">
      <div class="lbl">${esc(v.camera)} · risk ${esc(v.risk || "n/a")}${v.gap ? ` · closest gap ${esc(v.gap)}` : ""}</div>
      <div class="chips" style="margin:0 0 8px">${v.events.length ? v.events.map((e) => `<span class="chip">${EVENT_LABEL[e] || e}</span>`).join("") : `<span class="chip">No conflict from this angle</span>`}</div>
      ${esc(v.narrative)}
    </div>
    <button id="ack">${acked.has(i.id) ? "Reopen incident" : "Acknowledge"}</button>`;
  $("detail").querySelectorAll(".cams button").forEach((b) => b.onclick = () => { selectedCam = +b.dataset.n; renderDetail(); });
  attachOverlay(v.source, (det) => {
    const box = $("gapBox");
    if (!box) return;
    const c = det && det.closest;
    const said = v.gap ? `Cosmos caption says <strong>${esc(v.gap)}</strong>.` : "Cosmos caption gives no distance.";
    box.innerHTML = `<div class="lbl">Closest person–forklift gap · ${esc(v.camera)}</div>` + (c
      ? `<span class="gapv ${gapClass(c.gap_m)}">${fmtGap(c.gap_m)}</span> <span class="when">YOLO at ${fmtSec(c.t)}${c.held ? " (forklift box held from an earlier frame)" : ""}</span>
         <button id="jump" style="margin-left:8px">Jump to moment</button>
         <div class="when" style="margin-top:6px">${said} Estimate = 2D box distance scaled by the person's height (~1.7 m).</div>`
      : `<span class="when">YOLO saw no forklift near a person from this angle. ${said}</span>`);
    if (c && $("jump")) $("jump").onclick = () => { const p = $("player"); p.pause(); p.currentTime = Math.max(0, c.t); };
  });
  $("ack").onclick = () => {
    acked.has(i.id) ? acked.delete(i.id) : acked.add(i.id);
    localStorage.setItem("aisle-acked", JSON.stringify([...acked]));
    render();
  };
}

function render() { renderStats(); renderFilters(); renderList(); renderDetail(); }

async function load() {
  try {
    const r = await fetch(`${BASE}api/board`, { cache: "no-store" });
    data = await r.json();
    const when = data.updated ? new Date(data.updated * 1000).toLocaleTimeString() : "not yet";
    $("sub").textContent = `${(data.locations || []).join(", ")} · ${data.incidents.length} incidents · updated ${when}`;
    $("warn").hidden = !data.error;
    $("warn").textContent = data.error ? `Last refresh failed: ${data.error}` : "";
    if (!selected && mode === "incident" && data.incidents.length) selected = data.incidents[0].id;
    renderStats(); renderFilters(); renderList();
    if (!document.getElementById("player")) renderDetail();
  } catch (e) {
    $("sub").textContent = "Could not reach the board API";
  }
}

$("askForm").onsubmit = (e) => { e.preventDefault(); ask($("askInput").value); };
document.querySelectorAll(".ask .ex").forEach((b) => b.onclick = () => ask(b.textContent));
$("refresh").onclick = async () => { await fetch(`${BASE}api/refresh`, { method: "POST" }); setTimeout(load, 4000); };
$("showAck").onclick = () => { showAck = !showAck; $("showAck").textContent = showAck ? "Hide acknowledged" : "Show acknowledged"; render(); };
load();
setInterval(load, 30000);
</script>
</body>
</html>
